<!DOCTYPE html>
<!--
  reviews.html 생성기.

  data.js를 그대로 읽어 정적 리뷰 페이지를 만듭니다. 손으로 옮겨 적으면
  원본과 어긋나므로, 데이터가 바뀌면 이 파일로 다시 생성하세요.

  사용법 (프로젝트 루트에서):
    python -m http.server 8000
    브라우저로 http://localhost:8000/tools/build-reviews.html 열기
    -> 화면의 내용을 전부 복사해 reviews.html로 저장

  또는 헤드리스로:
    msedge --headless=new --dump-dom http://localhost:8000/tools/build-reviews.html
-->
<html><head><meta charset="utf-8"><title>reviews.html 생성기</title></head>
<body>
<pre id="out" style="white-space:pre-wrap;font:12px/1.5 monospace"></pre>
<script src="../data.js"></script>
<script>
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const fmt = n => n == null ? '–' : n.toFixed(1);
const avg = (list, pick) => {
  const v = list.map(pick).filter(x => typeof x === 'number');
  return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null;
};
const stars = v => `<span class="stars" role="img" aria-label="5점 만점에 ${fmt(v)}점">` +
  `<span class="stars-off">★★★★★</span>` +
  `<span class="stars-on" style="width:${(v / 5) * 100}%">★★★★★</span></span>`;

const SITE = 'https://roominfo.vercel.app';
const totalReviews = ROOMS.reduce((a, r) => a + r.reviews.length, 0);
const allAvg = avg(ROOMS.flatMap(r => r.reviews), r => r.rating);

const sections = ROOMS.map(room => {
  const score = avg(room.reviews, r => r.rating);
  const aspects = ASPECT_KEYS.map(a => {
    const v = avg(room.reviews.filter(r => r.aspects), r => r.aspects[a.key]);
    return `<li>${a.label} <b>${fmt(v)}</b></li>`;
  }).join('');

  const reviews = room.reviews.map(r => `
        <article class="r-review">
          <h3>${esc(r.author)} <span class="r-badge">거주 인증</span></h3>
          <p class="r-meta">거주 ${esc(r.period)} · ${esc(r.date)} 작성 · ${stars(r.rating)} <b>${fmt(r.rating)}</b></p>
          <p class="r-text">${esc(r.text)}</p>
          <p class="r-tags">${(r.tags || []).map(t => `<span>#${esc(t)}</span>`).join(' ')}</p>
        </article>`).join('');

  return `
      <section class="r-room" id="${room.id}">
        <h2>${esc(room.name)} 원룸 리뷰</h2>
        <p class="r-sub">${esc(room.type)} · ${esc(room.address)} · ${esc(room.walk)}</p>
        <p class="r-score">${stars(score)} <b>${fmt(score)}</b> <span>거주자 리뷰 ${room.reviews.length}개</span></p>
        <ul class="r-spec">
          <li>보증금 <b>${room.deposit.toLocaleString('ko-KR')}만원</b></li>
          <li>월세 <b>${room.rent}만원</b></li>
          <li>관리비 <b>${room.manage}만원</b></li>
          <li>층 <b>${esc(room.floorInfo)}</b></li>
          <li>전용면적 <b>${room.area}㎡</b></li>
        </ul>
        <ul class="r-aspects">${aspects}</ul>
        ${reviews}
        <p class="r-more"><a href="/#/room/${room.id}">지도에서 ${esc(room.name)} 보기 →</a></p>
      </section>`;
}).join('\n');

const jsonld = JSON.stringify({
  '@context': 'https://schema.org',
  '@type': 'ItemList',
  name: '성균관대 캠퍼스타운 원룸 리뷰 목록',
  numberOfItems: ROOMS.length,
  itemListElement: ROOMS.map((room, i) => ({
    '@type': 'ListItem',
    position: i + 1,
    item: {
      '@type': 'Accommodation',
      name: room.name,
      address: { '@type': 'PostalAddress', streetAddress: room.address, addressCountry: 'KR' },
      floorSize: { '@type': 'QuantitativeValue', value: room.area, unitCode: 'MTK' },
      aggregateRating: {
        '@type': 'AggregateRating',
        ratingValue: fmt(avg(room.reviews, r => r.rating)),
        reviewCount: room.reviews.length,
        bestRating: '5', worstRating: '0',
      },
      url: `${SITE}/reviews.html#${room.id}`,
    },
  })),
}, null, 2);

// textarea.value는 DOM 직렬화에 안 잡히므로 pre + textContent로 내보냅니다.
document.getElementById('out').textContent = `<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>성균관대 앞 원룸 리뷰 전체보기 — 자취방 ${ROOMS.length}곳 실거주 후기 ${totalReviews}개 | 방구석</title>
<meta name="description" content="성균관대 캠퍼스타운 원룸·오피스텔 ${ROOMS.length}곳의 실거주 리뷰 ${totalReviews}개를 한 페이지에 모았습니다. 채광, 방음, 수압, 벌레, 습도, 집주인 항목별 별점과 이전 거주자가 직접 남긴 후기를 확인하세요." />
<meta name="robots" content="index, follow, max-image-preview:large" />
<meta name="theme-color" content="#f4f4f2" />
<link rel="canonical" href="${SITE}/reviews.html" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />

<meta property="og:type" content="article" />
<meta property="og:site_name" content="방구석" />
<meta property="og:locale" content="ko_KR" />
<meta property="og:url" content="${SITE}/reviews.html" />
<meta property="og:title" content="성균관대 앞 원룸 리뷰 전체보기 — 실거주 후기 ${totalReviews}개" />
<meta property="og:description" content="채광, 방음, 수압, 벌레, 습도까지. 발품으로는 알 수 없는 원룸 실거주 리뷰 모음." />
<meta property="og:image" content="${SITE}/og-image.png" />
<meta name="twitter:card" content="summary_large_image" />

<script type="application/ld+json">
${jsonld}
<\/script>

<link rel="stylesheet" href="styles.css" />
<style>
  body { background: var(--bg); }
  .doc { max-width: 780px; margin: 0 auto; padding: 40px 24px 80px; }
  .doc-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 30px; }
  .doc-top a.home { font-size: 26px; font-weight: 800; letter-spacing: -.03em; color: var(--ink); text-decoration: none; }
  .doc-top a.home i { color: var(--violet); font-style: normal; }
  .doc-top a.to-map { font-size: 13px; color: var(--violet); text-decoration: none; font-weight: 600; }
  .doc h1 { font-size: 28px; font-weight: 800; letter-spacing: -.03em; line-height: 1.4; }
  .doc-lead { margin-top: 14px; font-size: 14px; line-height: 1.8; color: var(--ink-3); }
  .doc-lead b { color: var(--ink-2); }
  .toc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
         padding: 18px 22px; margin: 28px 0 8px; }
  .toc h2 { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
  .toc ol { display: grid; gap: 8px; counter-reset: n; }
  .toc li { counter-increment: n; font-size: 13.5px; }
  .toc li::before { content: counter(n) ". "; color: var(--ink-4); }
  .toc a { color: var(--ink-2); text-decoration: none; }
  .toc a:hover { color: var(--violet); }

  .r-room { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);
            box-shadow: var(--shadow-card); padding: 26px 28px; margin-top: 20px; scroll-margin-top: 20px; }
  .r-room h2 { font-size: 20px; font-weight: 800; letter-spacing: -.02em; }
  .r-sub { font-size: 12.5px; color: var(--ink-3); margin-top: 6px; }
  .r-score { display: flex; align-items: center; gap: 9px; margin-top: 14px; font-size: 15px; }
  .r-score span { font-size: 12px; color: var(--ink-3); font-weight: 400; }
  .r-spec, .r-aspects { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
  .r-spec li, .r-aspects li { background: var(--surface-mute); border-radius: 999px; padding: 6px 12px;
                              font-size: 11.5px; color: var(--ink-3); }
  .r-spec b, .r-aspects b { color: var(--ink); font-weight: 700; }
  .r-aspects li { background: var(--violet-tint); color: #7c3fae; }
  .r-aspects b { color: #7c3fae; }

  .r-review { border-top: 1px solid var(--line); margin-top: 20px; padding-top: 18px; }
  .r-review h3 { font-size: 14px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .r-badge { background: #e4f0e3; color: #4a8a4d; font-size: 10.5px; font-weight: 700;
             padding: 3px 9px; border-radius: 999px; }
  .r-meta { font-size: 11.5px; color: var(--ink-3); margin-top: 6px; display: flex; align-items: center; gap: 7px; }
  .r-text { font-size: 13.5px; line-height: 1.85; color: var(--ink-2); margin-top: 12px; }
  .r-tags { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
  .r-tags span { font-size: 11px; color: var(--ink-3); background: var(--surface-mute);
                 border-radius: 999px; padding: 4px 10px; }
  .r-more { margin-top: 20px; }
  .r-more a { font-size: 13px; font-weight: 600; color: var(--violet); text-decoration: none; }

  .doc-foot { margin-top: 40px; text-align: center; font-size: 12.5px; color: var(--ink-4); line-height: 2; }
  .doc-foot a { color: var(--violet); text-decoration: none; }
</style>
</head>
<body>
<div class="doc">
  <div class="doc-top">
    <a class="home" href="/">방구석<i>.</i></a>
    <a class="to-map" href="/">지도로 방 찾기 →</a>
  </div>

  <h1>성균관대 앞 원룸 리뷰 전체보기</h1>
  <p class="doc-lead">
    성균관대 캠퍼스타운 <b>원룸·오피스텔 ${ROOMS.length}곳</b>에 쌓인
    <b>실거주 리뷰 ${totalReviews}개</b>를 한 페이지에 모았습니다.
    전체 평균 평점은 <b>${fmt(allAvg)}점</b>입니다.
    채광, 방음, 수압, 벌레, 습도·단열, 관리·집주인 여섯 항목을 0.5점 단위로 평가했고,
    본문은 이전 거주자가 직접 남긴 내용 그대로입니다.
    발품으로는 알기 어려운 정보 위주로 확인하세요.
  </p>

  <nav class="toc">
    <h2>이 페이지에 있는 방</h2>
    <ol>
${ROOMS.map(r => `      <li><a href="#${r.id}">${esc(r.name)} — ${esc(r.type)}, ${esc(r.walk)}, 평점 ${fmt(avg(r.reviews, x => x.rating))}점</a></li>`).join('\n')}
    </ol>
  </nav>
${sections}

  <p class="doc-foot">
    리뷰는 실제 거주자가 남긴 후기입니다. 살았던 방이 있다면 <a href="/#/write">후기를 남겨주세요</a>.<br />
    <a href="/">방구석 홈으로</a>
  </p>
</div>
</body>
</html>
`;
</script>
</body></html>
